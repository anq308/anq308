name: Refresh monochrome profile

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'generate_profile.py'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate profile from public repository languages
        run: python3 generate_profile.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit updated graphics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-light.svg profile-dark.svg language-source.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile language composition'
            git push
          fi
